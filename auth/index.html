<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account | Mattioli 1885 Journals</title>
  <link rel="stylesheet" href="/auth/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <p class="eyebrow">Mattioli 1885 Journals</p>
      <h1 id="title">Sign in</h1>
      <p id="subtitle" class="muted">Access your journal account.</p>
      <form id="authForm">
        <label id="nameField" hidden>Full name<input id="fullName" type="text" autocomplete="name"></label>
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
        <label id="confirmField" hidden>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" minlength="6"></label>
        <button id="submitButton" type="submit">Sign in</button>
      </form>
      <button id="switchButton" class="link-button" type="button">Create an account</button>
      <button id="forgotButton" class="link-button" type="button">Forgot password?</button>
      <p id="message" class="message" role="status"></p>
    </section>
  </main>
  <script src="/supabase/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
