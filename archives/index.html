<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journal Archives | Mattioli 1885</title>
  <link rel="stylesheet" href="/archives/styles.css">
</head>
<body>
  <main class="archive-shell">
    <header class="archive-header">
      <a class="brand" href="/">Mattioli 1885 Journals</a>
      <a class="admin-link" href="/admin/">Control panel</a>
    </header>
    <section class="intro">
      <p class="eyebrow">Digital library</p>
      <h1>Journal archives</h1>
      <p>Browse the latest journals and PDF publications.</p>
      <label>Choose a journal<select id="journalSelect"><option>Loading journals...</option></select></label>
    </section>
    <p id="message" class="message" role="status"></p>
    <section id="archiveList" class="archive-list" aria-live="polite"></section>
  </main>
  <script src="/supabase/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/archives/app.js"></script>
</body>
</html>
